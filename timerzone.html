<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimerZone - Fixed Controls</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00f2fe;
            --accent-2: #4facfe;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0f0f; color: var(--text); min-height: 100vh; overflow: hidden; }

        #bg-video {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -1; object-fit: cover; filter: brightness(0.3);
        }

        .container { max-width: 900px; margin: 20px auto; padding: 20px; height: 95vh; overflow-y: auto; }
        
        /* Hide scrollbar for clean look */
        .container::-webkit-scrollbar { width: 0; }

        .glass-panel {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 25px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 20px; text-align: center;
        }

        h1 { font-size: 2.2rem; margin-bottom: 10px; background: linear-gradient(to right, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        #timer-display { 
            font-size: 5rem; font-weight: bold; margin: 15px 0; 
            font-family: 'VT323', monospace; color: var(--accent);
            text-shadow: 0 0 15px rgba(0,242,254,0.7);
        }
        #timer-display span { font-size: 2.5rem; opacity: 0.7; }

        .btn-group { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        button {
            padding: 10px 18px; border-radius: 50px; border: none;
            cursor: pointer; font-weight: 600; transition: 0.2s;
            text-transform: uppercase; font-size: 0.7rem;
        }
        .btn-start { background: #00b09b; color: white; }
        .btn-stop { background: #ff416c; color: white; }
        .btn-save { background: var(--accent-2); color: white; }
        .btn-reset { background: #555; color: white; }
        .btn-util { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); }
        button:active { transform: scale(0.95); }

        /* Manual Entry */
        .tabs { display: flex; justify-content: center; margin-bottom: 15px; }
        .tab-btn { background: none; border-radius: 0; padding: 8px 15px; border-bottom: 2px solid transparent; color: #ccc; }
        .tab-btn.active { border-bottom-color: var(--accent); color: var(--accent); }
        .tab-content { display: none; padding: 10px 0; }
        .tab-content.active { display: block; }
        
        input[type="date"], input[type="text"] { background: rgba(0,0,0,0.4); color: white; border: 1px solid var(--glass-border); padding: 8px; border-radius: 8px; margin-bottom: 10px; text-align: center; width: 100%; max-width: 250px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid var(--glass-border); color: var(--accent); }
        td { padding: 10px; border-bottom: 1px solid var(--glass-border); }
        .delete-btn { color: #ff416c; cursor: pointer; background: none; border: none; }

        /* Hidden helper elements */
        #pip-video { width: 1px; height: 1px; position: absolute; opacity: 0; }
    </style>
</head>
<body>

    <video autoplay muted loop id="bg-video"><source src="bg2.mp4" type="video/mp4"></video>
    <audio id="bgm" loop><source src="bgm1.mp3" type="audio/mpeg"></audio>
    
    <video id="pip-video" muted playsinline></video>

    <div class="container">
        <div class="glass-panel">
            <h1>TimerZone</h1>
            <div id="timer-display">00:00:00.<span>00</span></div>
            <div class="btn-group">
                <button class="btn-start" onclick="startTimer()">Start</button>
                <button class="btn-stop" onclick="stopTimer()">Stop</button>
                <button class="btn-save" onclick="saveSession()">Save</button>
                <button class="btn-reset" onclick="resetTimer()">Reset</button>
                <button class="btn-util" style="border-color: var(--accent)" onclick="toggleFloatingWindow()">👾 Float Mode</button>
                <button class="btn-util" id="music-btn" onclick="toggleMusic()">Music: Off</button>
            </div>
        </div>

        <div class="glass-panel">
            <h3 style="font-size: 1rem; margin-bottom: 10px;">Manual Log</h3>
            <input type="date" id="manual-date">
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab(event, 'quick')">Quick</button>
                <button class="tab-btn" onclick="openTab(event, 'type')">Type</button>
                <button class="tab-btn" onclick="openTab(event, 'slide')">Slide</button>
            </div>
            <div id="quick" class="tab-content active">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                    <button class="btn-util" onclick="addManual(1500)">25m</button>
                    <button class="btn-util" onclick="addManual(3000)">50m</button>
                    <button class="btn-util" onclick="addManual(5400)">1.5h</button>
                </div>
            </div>
            <div id="type" class="tab-content">
                <input type="text" id="smart-input" placeholder="e.g. 90m or 1.5h">
                <button class="btn-save" onclick="parseAndAdd()">Add</button>
            </div>
            <div id="slide" class="tab-content">
                <input type="range" id="slide-h" min="0" max="12" value="0" oninput="updateLabel()">
                <div style="font-size: 0.8rem">Hours: <span id="h-val">0</span></div>
                <button class="btn-save" onclick="addSliderTime()">Add</button>
            </div>
        </div>

        <div class="glass-panel">
            <table id="record-table">
                <thead><tr><th>Date</th><th>Hrs</th><th>Dur</th><th></th></tr></thead>
                <tbody id="record-body"></tbody>
            </table>
        </div>
    </div>

    <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1s2J2468hcQzzQPBhVYjKw?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

    <script>
        let totalMS = 0;
        let timerInterval = null;
        let records = JSON.parse(localStorage.getItem('timerZoneRecords')) || [];
        const pipVideo = document.getElementById('pip-video');
        const bgm = document.getElementById('bgm');

        window.onload = () => {
            document.getElementById('manual-date').value = new Date().toISOString().split('T')[0];
            
            // Resume timer if it was running before refresh
            const savedMS = parseInt(localStorage.getItem('tz_ms') || "0");
            const startTime = localStorage.getItem('tz_start');
            
            if (startTime) {
                totalMS = savedMS + (Date.now() - parseInt(startTime));
                startTimer(true);
            } else {
                totalMS = savedMS;
                updateDisplay();
            }
            updateUI();
            setupMediaHandlers();
        };

        function updateDisplay() {
            const h = Math.floor(totalMS / 3600000).toString().padStart(2, '0');
            const m = Math.floor((totalMS % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((totalMS % 60000) / 1000).toString().padStart(2, '0');
            const ms = Math.floor((totalMS % 1000) / 10).toString().padStart(2, '0');
            const str = `${h}:${m}:${s}`;
            document.getElementById('timer-display').innerHTML = `${str}.<span>${ms}</span>`;
            return `${str}.${ms}`;
        }

        function startTimer(resuming = false) {
            if (timerInterval) return;
            if (!resuming) localStorage.setItem('tz_start', Date.now().toString());
            
            timerInterval = setInterval(() => {
                totalMS += 100;
                updateDisplay();
                localStorage.setItem('tz_ms', totalMS.toString());
            }, 100);
            
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            localStorage.removeItem('tz_start');
            localStorage.setItem('tz_ms', totalMS.toString());
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
        }

        function resetTimer() {
            stopTimer();
            totalMS = 0;
            localStorage.setItem('tz_ms', "0");
            updateDisplay();
        }

        async function toggleFloatingWindow() {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = 150;
            const ctx = canvas.getContext('2d');

            // Set up the stream
            const stream = canvas.captureStream(10);
            pipVideo.srcObject = stream;
            await pipVideo.play();

            // Render loop for pixel design
            const render = () => {
                ctx.fillStyle = "black"; ctx.fillRect(0,0,400,150);
                ctx.fillStyle = "#00f2fe"; ctx.font = "80px VT323";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.shadowBlur = 10; ctx.shadowColor = "#00f2fe";
                ctx.fillText(updateDisplay(), 200, 75);
                if (document.pictureInPictureElement) requestAnimationFrame(render);
            };

            try {
                await pipVideo.requestPictureInPicture();
                render();
            } catch (e) { alert("Use Chrome/Edge for Float Mode."); }
        }

        function setupMediaHandlers() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', startTimer);
                navigator.mediaSession.setActionHandler('pause', stopTimer);
            }
        }

        function saveSession() {
            if (totalMS < 1000) return;
            addManual(Math.floor(totalMS/1000), true);
            resetTimer();
        }

        function addManual(sec, auto = false) {
            const date = auto ? new Date().toLocaleDateString() : document.getElementById('manual-date').value;
            records.push({
                id: Date.now(),
                date: date,
                hours: (sec/3600).toFixed(2),
                duration: `${Math.floor(sec/60)}m`
            });
            localStorage.setItem('timerZoneRecords', JSON.stringify(records));
            updateUI();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem('timerZoneRecords', JSON.stringify(records));
            updateUI();
        }

        function updateUI() {
            const body = document.getElementById('record-body');
            body.innerHTML = "";
            records.slice().reverse().forEach(r => {
                body.innerHTML += `<tr><td>${r.date}</td><td>${r.hours}h</td><td>${r.duration}</td><td><button class="delete-btn" onclick="deleteRecord(${r.id})">✖</button></td></tr>`;
            });
        }

        function openTab(e, id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            e.target.classList.add('active');
        }

        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            if (bgm.paused) { bgm.play(); btn.innerText = "Music: On"; }
            else { bgm.pause(); btn.innerText = "Music: Off"; }
        }

        function updateLabel() { document.getElementById('h-val').innerText = document.getElementById('slide-h').value; }
        function addSliderTime() { addManual(document.getElementById('slide-h').value * 3600); }
        function parseAndAdd() {
            const v = document.getElementById('smart-input').value.toLowerCase();
            let s = v.endsWith('h') ? parseFloat(v)*3600 : parseInt(v)*60;
            if(!isNaN(s)) addManual(s);
        }
    </script>
</body>

</html>
